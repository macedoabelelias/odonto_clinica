<script>

document.addEventListener("DOMContentLoaded", function () {

    const canvas = document.getElementById("graficoProducaoGestor");

    if (!canvas) return;

    const ctx = canvas.getContext("2d");

    // =========================================
    // GRADIENTE
    // =========================================

    const gradient = ctx.createLinearGradient(0, 0, 0, 380);

    gradient.addColorStop(0, "rgba(37,99,235,.35)");
    gradient.addColorStop(1, "rgba(37,99,235,0)");

    // =========================================
    // GRÁFICO
    // =========================================

    new Chart(ctx, {

        type: "line",

        data: {

            labels: JSON.parse('{{ grafico_labels|escapejs }}'),

            datasets: [{

                label: "Procedimentos",

                data: JSON.parse('{{ grafico_valores|escapejs }}'),

                borderColor: "#2563eb",

                backgroundColor: gradient,

                fill: true,

                tension: 0.25,

                borderWidth: 3,

                pointRadius: 5,

                pointHoverRadius: 8,

                pointBackgroundColor: "#2563eb",

                pointBorderColor: "#ffffff",

                pointBorderWidth: 2,

            }]

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            plugins: {

                legend: {

                    display: false

                },

                tooltip: {

                    backgroundColor: "#1e293b",

                    titleColor: "#ffffff",

                    bodyColor: "#ffffff",

                    padding: 12,

                    cornerRadius: 10,

                }

            },

            scales: {

                x: {

                    grid: {

                        display: false

                    },

                    ticks: {

                        color: "#6b7280",

                        font: {

                            size: 13,

                            weight: "600"

                        }

                    }

                },

                y: {

                    beginAtZero: true,

                    ticks: {

                        stepSize: 1,

                        precision: 0,

                        color: "#6b7280"

                    },

                    grid: {

                        color: "rgba(148,163,184,.15)"

                    }

                }

            }

        }

    });

});

</script>
